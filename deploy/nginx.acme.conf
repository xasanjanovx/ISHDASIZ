# Dedicated HTTP challenge route; the website's Vercel domain is untouched.
server {
    listen 80;
    server_name api.ishdasiz.uz bot.ishdasiz.uz api.167-235-249-200.sslip.io bot.167-235-249-200.sslip.io;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ishdasiz-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
