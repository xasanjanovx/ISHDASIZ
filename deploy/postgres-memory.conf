# Initial profile for a NEW isolated PostgreSQL 17 instance with a 512 MiB
# container budget. Never load this into the host's unrelated PostgreSQL 18.
# Recheck real restored-data load and service pool sizes before production.
shared_buffers = '128MB'
work_mem = '1MB'
hash_mem_multiplier = 1.0
maintenance_work_mem = '16MB'
autovacuum_work_mem = '16MB'
autovacuum_max_workers = 2
max_connections = 30
superuser_reserved_connections = 3
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
jit = off
wal_buffers = '4MB'
max_wal_size = '512MB'
checkpoint_completion_target = 0.9
idle_in_transaction_session_timeout = '60s'
log_statement = 'none'
log_min_messages = 'warning'
# Planner estimate only; this does NOT reserve another 384 MB.
effective_cache_size = '384MB'
