# Render only for the verified API/bot host pair and existing certificate.
server {
    listen 443 ssl;
    http2 on;
    server_name __API_HOST__;
    ssl_certificate /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    access_log off;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:3150;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.ishdasiz.uz;
        proxy_set_header X-Forwarded-Host api.ishdasiz.uz;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name __BOT_HOST__;
    ssl_certificate /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    access_log off;
    client_max_body_size 1m;
    location = /api/health {
        proxy_pass http://127.0.0.1:3130;
        proxy_set_header Host bot.ishdasiz.uz;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/telegram/webhook {
        proxy_pass http://127.0.0.1:3130;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host bot.ishdasiz.uz;
        proxy_set_header X-Forwarded-Host bot.ishdasiz.uz;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
    location / { return 404; }
}
