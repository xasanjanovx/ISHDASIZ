user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  map_hash_bucket_size 512;
  # No query strings, IPs, credentials or auth tokens in request logs.
  log_format bounded '$request_method $uri $status $body_bytes_sent $request_time';
  access_log /dev/stdout bounded;
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 1m;
  keepalive_timeout 15s;
  server_tokens off;
  include /etc/nginx/ishdasiz-api-keys.conf;
  map $http_origin $ishdasiz_origin {
    default "";
    "https://ishdasiz.uz" "https://ishdasiz.uz";
    "https://www.ishdasiz.uz" "https://www.ishdasiz.uz";
  }
  map $http_origin $ishdasiz_origin_rejected {
    default 1;
    "" 0;
    "https://ishdasiz.uz" 0;
    "https://www.ishdasiz.uz" 0;
  }
  map $http_authorization $ishdasiz_authorization {
    default $http_authorization;
    "" "Bearer $http_apikey";
  }
  map "$ishdasiz_api_role:$request_method" $ishdasiz_public_read {
    default 0;
    ~^service: 1;
    ~^anon:(GET|HEAD)$ 1;
  }
  map "$ishdasiz_api_role:$request_method" $ishdasiz_public_count {
    default 0;
    ~^service: 1;
    ~^anon:(GET|HEAD|POST)$ 1;
  }
  upstream ishdasiz_rest { server rest:3000; keepalive 8; }
  upstream ishdasiz_auth { server auth:9999; keepalive 4; }
  server {
    listen 8080;
    server_name _;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin $ishdasiz_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, POST, PATCH, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "apikey, authorization, content-type, accept-profile, content-profile, prefer, range, range-unit, x-client-info, x-supabase-api-version, x-supabase-client-platform, x-supabase-client-runtime, x-supabase-client-version" always;
    add_header Access-Control-Expose-Headers "content-range, range-unit, preference-applied, x-total-count, x-supabase-api-version" always;
    add_header Access-Control-Max-Age 600 always;
    if ($ishdasiz_origin_rejected) { return 403; }
    if ($request_method = OPTIONS) { return 204; }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host api.ishdasiz.uz;
    proxy_set_header X-Forwarded-Host api.ishdasiz.uz;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $ishdasiz_authorization;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    location = /health {
      default_type application/json;
      return 200 '{"status":"ok"}';
    }
    # Browser lookup/public-vacancy calls. DB grants also prevent embedded
    # joins into users/resumes/private tables and all browser mutations.
    location ~ ^/rest/v1/(categories|regions|districts|jobs)$ {
      if ($ishdasiz_api_role = "") { return 401; }
      if ($ishdasiz_public_read = 0) { return 403; }
      rewrite ^/rest/v1/(.*)$ /$1 break;
      proxy_pass http://ishdasiz_rest;
    }
    location ~ ^/rest/v1/rpc/(ishdasiz_public_home_counts|ishdasiz_public_job_counts)$ {
      if ($ishdasiz_api_role = "") { return 401; }
      if ($ishdasiz_public_count = 0) { return 403; }
      rewrite ^/rest/v1/(.*)$ /$1 break;
      proxy_pass http://ishdasiz_rest;
    }
    location /rest/v1/ {
      if ($ishdasiz_api_role = "") { return 401; }
      if ($ishdasiz_api_role != service) { return 403; }
      proxy_pass http://ishdasiz_rest/;
    }
    # Supabase email/OAuth callbacks do not carry the SDK's apikey header.
    location ~ ^/auth/v1/(verify|callback|authorize|\.well-known/.*)$ {
      rewrite ^/auth/v1/(.*)$ /$1 break;
      proxy_pass http://ishdasiz_auth;
    }
    location /auth/v1/ {
      if ($ishdasiz_api_role = "") { return 401; }
      proxy_pass http://ishdasiz_auth/;
    }
    location / { return 404; }
  }
}
