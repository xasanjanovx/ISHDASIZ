<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ISHDASIZ Studio — обзор</title><style>
@font-face{font-family:Onest;src:url('assets/onest.woff2')}*{box-sizing:border-box}body{margin:0;padding:32px;background:#f5f6f2;color:#182c32;font-family:Onest,Arial,sans-serif}header{max-width:1450px;margin:0 auto 26px}h1{font-size:29px;letter-spacing:-1px;margin:0 0 10px}p{font-size:14px;line-height:1.6;color:#5c6a6c;margin:0}a{color:#205bea;text-decoration:none;font-weight:600}main{max-width:1450px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:27px 24px}article{min-width:0}article>.caption{display:flex;align-items:center;justify-content:space-between;max-width:265px;margin-bottom:12px}h2{font-size:14px;margin:0;font-weight:650}article a{font-size:12px}.phone{display:block;width:265px;height:574px;border-radius:25px;overflow:hidden;background:#f5f6f2;box-shadow:0 9px 24px #182c320c;border:1px solid #dce0dc;position:relative}iframe{display:block;width:390px;height:844px;border:0;transform:scale(.68);transform-origin:top left;background:#f5f6f2}@media(max-width:600px){body{padding:25px 20px}main{grid-template-columns:265px;justify-content:center}header{text-align:center}h1{font-size:25px}}
</style></head><body><header><h1>ISHDASIZ Studio</h1><p>Публикация на первом плане. <a href="index.html">Открыть приложение →</a></p></header><main id="screens"></main><script>
const screens=[['Главная','home'],['Разместить вакансию','vacancy'],['Разместить резюме','resume'],['Профиль','profile'],['Поиск','search'],['Объявления','listings'],['Тарифы','plans'],['Календарь','schedule'],['Вход','auth'],['Настройки','settings'],['Пост канала','preview'],['Администратор','admin'],['Рассылка','broadcast']];document.getElementById('screens').innerHTML=screens.map(([name,screen])=>`<article><div class="caption"><h2>${name}</h2><a href="index.html?screen=${screen}">Открыть ↗</a></div><div class="phone"><iframe src="index.html?screen=${screen}" title="${name}" loading="lazy"></iframe></div></article>`).join('');
</script></body></html>
